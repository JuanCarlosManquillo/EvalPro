spring.application.name=usuariosSpring

# Configuración para la base de datos
spring.datasource.url=jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true;databaseName=DatosRA
spring.datasource.username=prueba
spring.datasource.password=prueba
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración del JPA
spring.jpa.hibernate.ddl-auto =none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Otras configuraciones recomendadas

# Desactivar la conexión SSL si no la necesitas (opcional)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;encrypt=false;trustServerCertificate=true;databaseName=nombreDeLaBaseDeDatos
