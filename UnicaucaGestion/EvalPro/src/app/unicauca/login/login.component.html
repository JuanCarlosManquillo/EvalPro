<app-header></app-header>
<form class="login-form" (ngSubmit)="onLogin()">
  <p class="login-text">
    <span class="fa-stack fa-lg">
      <i class="fa fa-circle fa-stack-2x"></i>
      <i class="fa fa-lock fa-stack-1x"></i>
    </span>
  </p>
  <input type="email" class="login-username" [(ngModel)]="email" name="email" autofocus="true" required="true" placeholder="Email" />
  <input type="password" class="login-password" [(ngModel)]="password" name="password" required="true" placeholder="Password" />
  <button type="submit" class="login-submit">Login</button>
</form>

<div class="underlay-photo"></div>
<div class="underlay-black"></div>
<app-footer></app-footer>
