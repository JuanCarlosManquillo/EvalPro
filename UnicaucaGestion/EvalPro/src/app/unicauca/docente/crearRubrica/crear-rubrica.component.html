<div class="crear-RAP">
    <button class="btn-back" routerLink="/docente/rubricas" role="button">←</button>
    <h2>Creación de rúbricas</h2>
    <div class="card-body">
        <form>
            <div class="form-group row">
                <label for="nombre">Ingrese Nombre de la Rúbrica:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Rúbrica 1" />
            </div>
            <div class="form-group row">
                <label for="nombre">Ingrese el porcentaje de la nota:</label>
                <input type="text" class="form-control" id="nombre" placeholder="30%" />
            </div>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2">Criterio</th>
                        <th colspan="5">Descripción</th>
                        </tr>
                        <tr>
                            <td>[0.0-0.9)</td>
                            <td>[1.0-1.9)</td>
                            <td>[2.0-2.9)</td>
                            <td>[3.0-3.9)</td>
                            <td>[4.0-5.0)</td>
                        </tr>
                    </thead>
                </table>
            </div>
            
            <button class="btn" role="button" routerLink="/docente/rubricas">Crear</button>
        </form>
    </div>
</div>
