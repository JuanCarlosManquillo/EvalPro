<div class="crear-RAP">
    <button class="btn-back" routerLink="/docente/rubricas" role="button">←</button>
    <h2>Creación de Resultados de Aprendizaje para la Asignatura</h2>
    <div class="card-body">
        <form>
            <div class="form-group row">
                <label for="nombre">Asignatura:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Asignatura 1" />
            </div>

            <div class="form-group row">
                <label for="nombre">Commpetencia de Asignatura:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Competencia de asignatura 1" />
            </div>

            <div class="form-group row">
                <label for="nombre">Docente:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Daniel Paz Perafán 1" />
            </div>

            <div class="form-group row">
                <label for="periodo">Periodo:</label>
                <select name="periodo" id="periodo">
                    <option value="" disabled selected>Seleccione un periodo</option>
                    <option value="2024-1">2024-1</option>
                    <option value="2024-2">2024-2</option>
                    <option value="2025-1">2025-1</option>
                </select>
            </div>
            
            <button class="btn" role="button" routerLink="/docente/rubricas">Vincular</button>
        </form>
    </div>
</div>
