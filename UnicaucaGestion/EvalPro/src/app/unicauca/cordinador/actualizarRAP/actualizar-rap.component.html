<div class="crear-RAP">
    <button class="btn-back" routerLink="/crear-competencia-programa" role="button">←</button>
    <h2>Creación de Resultados de Aprendizaje por Programa</h2>
    <div class="card-body">
        <form (ngSubmit)="actualizar()">
            <div class="form-group row">
                <label for="nombre">Ingrese Descripción:</label>
                <input type="text" class="form-control" [(ngModel)]="RA.descripcion" name="descripcion" id="nombre" placeholder="Resultado Aprendizaje 1" required />
            </div>
            
            <button type="submit" class="btn btn-agregar">Agregar</button>
        </form>
    </div>
</div>
