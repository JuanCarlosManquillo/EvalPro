<div >
    <header class="header">
        <h1>Bienvenido UserCoordinador</h1>
        <nav class="nav-bar">
            <a routerLink="/asignaturas">Asignaturas</a>
            <a routerLink="/docente">Docentes</a>
            <a routerLink="/cordinador">Gestión de Competencias</a>
        </nav>
    </header>
    
    <main>
        <section class="competencias">
            <h2>Lista de competencias</h2>
        <table>
            <thead>
                <tr>
                <th>Id</th>
                <th>Competencia Programa</th>
                <th>Competencia</th>
                <th>Resultados de Aprendizaje</th>
                <th>Opciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let competencia of competencias">
                    <td>{{ competencia.id }}</td>
                    <td>{{ competencia.competenciaPrograma }}</td>
                    <td>{{ competencia.competenciaAsignatura }}</td>
                    <td>
                    <button class="btn btn-detalles" routerLink="/listar-RAA">Detalles</button>
                    </td>
                    <td>
                        <button class="btn btn-editar" routerLink="/actualizar-competencia-asignatura">Editar</button>
                        <button class="btn btn-eliminar" style="margin-left: 5px;">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="container_buttom">
            <button class="btn btn-agregar" routerLink="/crear-competencia-asignatura">Agregar</button>
            <button class="btn btn-back" routerLink="/asignaturas">Volver</button>
        </div>
            
        </section>
    </main>
</div>
