<div class="actualizar-competencia">
    <button class="btn-back" routerLink="/cordinador" role="button">←</button>
    <h2>Editar Competencias de Programa</h2>
    <div class="card-body">
        <form>
            <div class="form-group row">
                <label for="nombre">Ingrese Nombre:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Competencia 1" />
            </div>
            <div class="form-group row">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" placeholder="Esta competencia permite que..."></textarea>
            </div>
            <div class="form-group row">
                <label for="nivel">Nivel:</label>
                <select id="nivel">
                    <option value="" disabled selected>Seleccione un nivel</option>
                    <option value="Bajo">Bajo</option>
                    <option value="Medio">Medio</option>
                    <option value="Alto">Alto</option>
                </select>
            </div>
            <button class="btn" routerLink="/cordinador" role="button">Actualizar</button>
        </form>
    </div>
</div>
