<div class="actualizar-competencia">
    <button class="btn-back" routerLink="/listar-competencia-asignatura" role="button">←</button>
    <h2>Editar Competencias de Asignatura</h2>
    <div class="card-body">
        <form>
            <div class="form-group row">
                <label for="nombre">Ingrese Nombre:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Competencia 1" />
            </div>
            <div class="form-group row">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" placeholder="Esta competencia permite que..."></textarea>
            </div>
            <button class="btn" routerLink="/listar-competencia-asignatura" role="button">Actualizar</button>
        </form>
    </div>
</div>
