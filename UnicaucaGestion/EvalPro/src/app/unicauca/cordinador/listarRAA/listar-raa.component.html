<div>
    

    <header class="header">
        <h1>Bienvenido UserCoordinador</h1>
        <nav class="nav-bar">
            <a routerLink="/asignaturas">Asignaturas</a>
            <a routerLink="/docente">Docentes</a>
            <a routerLink="/cordinador">Gestión de Competencias</a>
        </nav>
    </header>
    <main>
        <h2>Listado de resultados de aprendizaje de la competencia de la asignatura</h2>   
        <table>
        
        <thead>
            <tr>
            <th>Id</th>
            <th>Descripción</th>
            <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
          <tr *ngFor="let resultado of resultados">
            <td>{{ resultado.id }}</td>
            <td>{{ resultado.descripcion }}</td>
            <td>
                <button class="btn btn-editar" routerLink="/actualizar-RAA">Editar</button>
                <button class="btn btn-eliminar" (click)="eliminarRAA(resultado.id)" style="margin-left: 5px">Eliminar</button>
            </td>
            </tr>
        </tbody>
        </table>
        <div class="container_buttom">
        <button class="btn btn-agregar" routerLink="/crear-RAA">Agregar</button>
        <button class="btn btn-back" routerLink="/listar-competencia-asignatura">Volver</button>
        </div>
    </main>
</div>
