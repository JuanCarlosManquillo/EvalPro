<div class="actualizar-RAP">
    <button class="btn-back" routerLink="/listar-RAA" role="button">←</button>
    <h2>Editar  Resultados de Aprendizaje por Asignatura</h2>
    <div class="card-body">
        <form (ngSubmit)="updateRAA()">
            <div class="form-group row">
                <label for="descripcion">Ingrese Descripción:</label>
                <input type="text" class="form-control" id="descripcion" [(ngModel)]="ra.descripcion" name="descripcion" placeholder="Resultado Aprendizaje 1" required />
            </div>
            <button class="btn" type="submit">Actualizar</button>
        </form>
    </div>
</div>
