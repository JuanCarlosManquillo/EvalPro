<div >
  <header class="header">
    <h1>Bienvenido UserCoordinador</h1>
    <nav class="nav-bar">
      <a routerLink="/asignaturas">Asignaturas</a>
      <a routerLink="/docente">Docentes</a>
      <a routerLink="/cordinador">Gestión de Competencias</a>
    </nav>
  </header>
  
  <main>
    <section class="competencias">
      <h2>Lista de competencias</h2>
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Competencia</th>
            <th>Nivel</th>
            <th>Resultados de Aprendizaje</th>
            <th>Opciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let competencia of competencias">
            <td>{{ competencia.id }}</td>
            <td>{{ competencia.nombre }}</td>
            <td>{{ competencia.nivel }}</td>
            <td>
              <button class="btn btn-detalles" routerLink="/listar-RAC">Detalles</button>
            </td>
            <td>
              <button class="btn btn-editar" routerLink="/actualizar-competencia">Editar</button>
              <button class="btn btn-eliminar">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button class="btn btn-agregar" routerLink="/crear-competencia-programa">Agregar</button>
    </section>
  </main>
</div>
